name: Build

# Solo comprueba que todo compila y que los tests pasan.
# Publicar lo hace build-apk.sh en el PC de Pol: las claves de firma nunca salen de allí.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and debug build
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            receivers/androidtv/build/outputs/apk/debug/androidtv-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build receiver .exe
        run: dotnet publish receivers/windows/HPlayReceiver.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/HPlay-Receptor.exe
