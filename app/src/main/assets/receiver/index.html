<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HPlay</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e8ecff; font-family: sans-serif; overflow: hidden; }
  video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
  #ov { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px; background: rgba(4, 11, 38, .82); font-size: 20px; }
  #ov.hide { display: none; }
  #msg { margin-right: 16px; }
  button { font-size: 20px; padding: 10px 18px; margin: 4px 8px 4px 0; border-radius: 10px; border: 2px solid #2ec8f7; background: #0b1638; color: #e8ecff; }
  button:focus { outline: 3px solid #fff; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
<div id="ov">
  <span id="msg">…</span>
  <button id="snd" type="button"></button>
  <button id="fs" type="button"></button>
</div>
<script src="jmuxer.min.js"></script>
<script src="receiver.js"></script>
</body>
</html>
