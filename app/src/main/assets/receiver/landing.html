<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HPlay</title>
<style>
  html, body { margin: 0; height: 100%; background: #040b26; color: #e8ecff; font-family: sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 10vh 16px; text-align: center; }
  h1 { font-size: 48px; margin: 0 0 16px; }
  p { font-size: 22px; }
  input { font-size: 40px; width: 8em; max-width: 100%; text-align: center; letter-spacing: .2em; padding: 10px; border-radius: 12px; border: 3px solid #2ec8f7; background: #0b1638; color: #fff; }
  button { font-size: 28px; padding: 12px 28px; margin-top: 20px; border-radius: 12px; border: 0; background: #2ec8f7; color: #00131f; }
  input:focus, button:focus { outline: 4px solid #fff; }
</style>
</head>
<body>
<main>
  <h1>HPlay</h1>
  <p id="t">Code shown on the phone:</p>
  <form id="f">
    <input id="c" maxlength="6" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus aria-labelledby="t">
    <br><button id="b" type="submit">OK</button>
  </form>
</main>
<script>
  (function () {
    if ((navigator.language || '').toLowerCase().indexOf('es') === 0) document.getElementById('t').textContent = 'Código que aparece en el móvil:';
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      var c = document.getElementById('c').value.replace(/[^a-z0-9]/gi, '').toLowerCase();
      if (c) location.href = '/' + c + '/';
    };
  })();
</script>
</body>
</html>
